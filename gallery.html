<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Nasara Website</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Quicksand:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Caveat:wght@400;700&family=Roboto:wght@400;500;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #c9c6ff 50%, #a1c4fd 75%, #c2e9fb 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Optimized animated background elements */
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 25s infinite ease-in-out;
            z-index: -1;
            will-change: transform;
        }
        
        .bubble-1 {
            width: 150px;
            height: 150px;
            background-color: #ff758c;
            top: 10%;
            left: 5%;
            animation-duration: 25s;
        }
        
        .bubble-2 {
            width: 120px;
            height: 120px;
            background-color: #ff7eb3;
            top: 60%;
            right: 10%;
            animation-duration: 30s;
            animation-delay: 2s;
        }
        
        .bubble-3 {
            width: 130px;
            height: 130px;
            background-color: #8e7cc3;
            bottom: 10%;
            left: 15%;
            animation-duration: 35s;
            animation-delay: 5s;
        }
        
        /* Optimized animated particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
            will-change: transform, opacity;
        }
        
        .particle-1 {
            width: 8px;
            height: 8px;
            background-color: #fff;
            top: 20%;
            left: 10%;
            animation: twinkle 4s infinite alternate;
        }
        
        .particle-2 {
            width: 6px;
            height: 6px;
            background-color: #fff;
            top: 40%;
            right: 20%;
            animation: twinkle 3s infinite alternate 1s;
        }
        
        .particle-3 {
            width: 10px;
            height: 10px;
            background-color: #fff;
            bottom: 30%;
            left: 25%;
            animation: twinkle 5s infinite alternate 2s;
        }
        
        /* Optimized floating hearts */
        .heart-float {
            position: absolute;
            bottom: -10%;
            font-size: 16px;
            color: rgba(255, 105, 180, 0.4);
            animation: floatUp 15s linear infinite;
            will-change: transform;
        }
        
        /* Optimized gradient overlay */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 117, 140, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(142, 124, 195, 0.15) 0%, transparent 50%);
            z-index: -1;
            animation: pulse 12s infinite alternate;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-15px) rotate(3deg);
            }
            66% {
                transform: translateY(15px) rotate(-3deg);
            }
        }
        
        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes pulse {
            0% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                opacity: 0.2;
            }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
            position: relative;
            width: 100%;
        }
        
        .back-button {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            z-index: 100;
            pointer-events: auto;
        }
        
        .back-button:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            background-color: rgba(255, 255, 255, 0.6);
        }
        
        .back-button i {
            font-size: 24px;
            color: #ff4081;
        }
        
        h1 {
            font-family: 'Raleway', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff4081, 0 0 30px #ff4081, 0 0 40px #ff4081;
            color: #d81b60;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
            animation: glow 2s infinite alternate;
            will-change: text-shadow;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #ff4081, 0 0 30px #ff4081, 0 0 40px #ff4081;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ff4081, 0 0 40px #ff4081, 0 0 50px #ff4081;
            }
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            animation: fadeIn 1.5s ease;
        }
        
        .photo-slot {
            aspect-ratio: 1/1;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            will-change: transform;
        }
        
        .photo-slot:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            will-change: transform;
        }
        
        .photo-slot:hover img {
            transform: scale(1.05);
        }
        
        .photo-placeholder {
            color: rgba(0, 0, 0, 0.5);
            font-size: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }
        
        .photo-placeholder span {
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff4081;
            animation: spin 1s ease-in-out infinite;
            will-change: transform;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Messages Section */
        .messages-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .message-card {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        
        .message-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .message-card:hover::before {
            opacity: 1;
        }
        
        .message-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .message-title {
            font-family: 'Roboto', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .message-content {
            display: none;
            margin-top: 10px;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            line-height: 1.5;
        }
        
        .message-content.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        /* Individual message colors */
        .message-card:nth-child(1) .message-title {
            color: #e91e63;
        }
        
        .message-card:nth-child(1) .message-content {
            color: #c2185b;
        }
        
        .message-card:nth-child(2) .message-title {
            color: #673ab7;
        }
        
        .message-card:nth-child(2) .message-content {
            color: #512da8;
        }
        
        .message-card:nth-child(3) .message-title {
            color: #3f51b5;
        }
        
        .message-card:nth-child(3) .message-content {
            color: #303f9f;
        }
        
        .message-card:nth-child(4) .message-title {
            color: #009688;
        }
        
        .message-card:nth-child(4) .message-content {
            color: #00796b;
        }
        
        .message-card:nth-child(5) .message-title {
            color: #ff5722;
        }
        
        .message-card:nth-child(5) .message-content {
            color: #e64a19;
        }
        
        .message-card:nth-child(6) .message-title {
            color: #ff9800;
        }
        
        .message-card:nth-child(6) .message-content {
            color: #f57c00;
        }
        
        /* Special Message */
        .special-message {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-family: 'Roboto', sans-serif;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: 500;
            line-height: 1.6;
            color: #4a148c;
            max-width: 90%;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }
        
        .special-message:hover {
            transform: scale(1.02);
        }
        
        .special-message::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,105,180,0.2) 0%, rgba(255,105,180,0) 70%);
            animation: pulse 4s infinite;
        }
        
        /* Countdown Section */
        .countdown {
            margin: 30px 0;
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
        }
        
        .countdown-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 15px;
            color: #4a148c;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        
        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            min-width: 70px;
            transition: transform 0.3s ease;
            will-change: transform;
        }
        
        .time-unit:hover {
            transform: translateY(-3px);
        }
        
        .time-value {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: #311b92;
        }
        
        .time-label {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: #512da8;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .anniversary-message {
            display: none;
            font-family: 'Raleway', sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            text-align: center;
            margin: 30px 0;
            color: #b71c1c;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            animation: glow 2s infinite alternate;
            letter-spacing: 2px;
        }
        
        footer {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }
        
        .footer-message {
            font-family: 'Roboto', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 500;
            color: #1a237e;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        
        .heart {
            color: #000;
            font-size: 1.5rem;
            vertical-align: middle;
        }
        
        /* Image Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            max-height: 80%;
            object-fit: contain;
            animation: zoomIn 0.3s ease;
            will-change: transform;
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
        }
        
        /* Optimized Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Optimized Responsive Design */
        @media (max-width: 1024px) {
            .container {
                max-width: 95%;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .messages-container {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 12px;
            }
            
            .time-unit {
                min-width: 60px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .messages-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .countdown-timer {
                gap: 8px;
            }
            
            .time-unit {
                min-width: 50px;
                padding: 5px;
            }
        }
        
        /* Performance optimization for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Nasara Website</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Quicksand:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Enhanced animated background elements */
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
            z-index: -1;
        }
        
        .bubble-1 {
            width: 200px;
            height: 200px;
            background-color: #ff758c;
            top: 10%;
            left: 5%;
            animation-duration: 25s;
        }
        
        .bubble-2 {
            width: 150px;
            height: 150px;
            background-color: #ff7eb3;
            top: 60%;
            right: 10%;
            animation-duration: 30s;
            animation-delay: 2s;
        }
        
        .bubble-3 {
            width: 180px;
            height: 180px;
            background-color: #8e7cc3;
            bottom: 10%;
            left: 15%;
            animation-duration: 35s;
            animation-delay: 5s;
        }
        
        /* Additional animated elements */
        .particle {
            position: fixed;
            border-radius: 50%;
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle-1 {
            width: 10px;
            height: 10px;
            background-color: #fff;
            top: 20%;
            left: 10%;
            animation: twinkle 4s infinite alternate;
        }
        
        .particle-2 {
            width: 8px;
            height: 8px;
            background-color: #fff;
            top: 40%;
            right: 20%;
            animation: twinkle 3s infinite alternate 1s;
        }
        
        .particle-3 {
            width: 12px;
            height: 12px;
            background-color: #fff;
            bottom: 30%;
            left: 25%;
            animation: twinkle 5s infinite alternate 2s;
        }
        
        .particle-4 {
            width: 6px;
            height: 6px;
            background-color: #fff;
            top: 70%;
            right: 15%;
            animation: twinkle 4.5s infinite alternate 0.5s;
        }
        
        .particle-5 {
            width: 9px;
            height: 9px;
            background-color: #fff;
            bottom: 20%;
            right: 30%;
            animation: twinkle 3.5s infinite alternate 1.5s;
        }
        
        /* Floating hearts */
        .heart-float {
            position: absolute;
            bottom: -10%;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            animation: floatUp 15s linear infinite;
        }
        
        /* Animated gradient overlay */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 117, 140, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(142, 124, 195, 0.2) 0%, transparent 50%);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-20px) rotate(5deg);
            }
            66% {
                transform: translateY(20px) rotate(-5deg);
            }
        }
        
        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes pulse {
            0% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 0.3;
            }
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
            position: relative;
        }
        
        .back-button {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .back-button:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .back-button i {
            font-size: 24px;
            color: #fff;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: #fff;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            animation: fadeIn 1.5s ease;
        }
        
        .photo-slot {
            aspect-ratio: 1/1;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .photo-slot:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .photo-slot:hover img {
            transform: scale(1.05);
        }
        
        .photo-placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-size: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }
        
        .photo-placeholder span {
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Image Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            max-height: 80%;
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .gallery {
                grid-template-columns: 1fr;
            }
        }
        
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-bubble bubble-1"></div>
    <div class="bg-bubble bubble-2"></div>
    <div class="bg-bubble bubble-3"></div>
    
    <!-- Additional animated particles -->
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>
    
    <!-- Gradient overlay -->
    <div class="gradient-overlay"></div>
    
    <!-- Floating hearts container -->
    <div class="floating-hearts" id="hearts-container"></div>
    
    <div class="container">
        <header>
            <div class="back-button" id="back-button">
                <i class="material-icons">arrow_back</i>
            </div>
            <h1>Our Gallery</h1>
        </header>
        
        <section class="gallery" id="gallery">
            <!-- Photo slots will be created dynamically -->
        </section>
    </div>
    
    <!-- Modal for full-size image -->
    <div id="imageModal" class="modal">
        <span class="close">×</span>
        <img class="modal-content" id="modalImage">
    </div>
    
    <script>
        // Photo URLs with multiple formats to try
        const photoUrls = [
            {
                id: '1qtJSDk9Z84vjH3yPecfESHz34pZtQ7xe',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1qtJSDk9Z84vjH3yPecfESHz34pZtQ7xe',
                    'https://lh3.googleusercontent.com/d/1qtJSDk9Z84vjH3yPecfESHz34pZtQ7xe',
                    'https://drive.google.com/thumbnail?id=1qtJSDk9Z84vjH3yPecfESHz34pZtQ7xe&sz=w1000'
                ]
            },
            {
                id: '13u22vw5-Fih5tpa0not0tMtnXjAh-u2-',
                formats: [
                    'https://drive.google.com/uc?export=view&id=13u22vw5-Fih5tpa0not0tMtnXjAh-u2-',
                    'https://lh3.googleusercontent.com/d/13u22vw5-Fih5tpa0not0tMtnXjAh-u2-',
                    'https://drive.google.com/thumbnail?id=13u22vw5-Fih5tpa0not0tMtnXjAh-u2-&sz=w1000'
                ]
            },
            {
                id: '1glDdn8llLk8YFqOAZYBPe1B93cHWzbe4',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1glDdn8llLk8YFqOAZYBPe1B93cHWzbe4',
                    'https://lh3.googleusercontent.com/d/1glDdn8llLk8YFqOAZYBPe1B93cHWzbe4',
                    'https://drive.google.com/thumbnail?id=1glDdn8llLk8YFqOAZYBPe1B93cHWzbe4&sz=w1000'
                ]
            },
            {
                id: '1I12_Xy_KNyUlA5n8UzY6scuFSkz73UJp',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1I12_Xy_KNyUlA5n8UzY6scuFSkz73UJp',
                    'https://lh3.googleusercontent.com/d/1I12_Xy_KNyUlA5n8UzY6scuFSkz73UJp',
                    'https://drive.google.com/thumbnail?id=1I12_Xy_KNyUlA5n8UzY6scuFSkz73UJp&sz=w1000'
                ]
            },
            {
                id: '12d7FoFiZAloMPhyWlwHLtvRkMWfZLWlb',
                formats: [
                    'https://drive.google.com/uc?export=view&id=12d7FoFiZAloMPhyWlwHLtvRkMWfZLWlb',
                    'https://lh3.googleusercontent.com/d/12d7FoFiZAloMPhyWlwHLtvRkMWfZLWlb',
                    'https://drive.google.com/thumbnail?id=12d7FoFiZAloMPhyWlwHLtvRkMWfZLWlb&sz=w1000'
                ]
            },
            {
                id: '1LM1UTtDvjSbUkTgPwmxQ-XUwY8MT80nN',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1LM1UTtDvjSbUkTgPwmxQ-XUwY8MT80nN',
                    'https://lh3.googleusercontent.com/d/1LM1UTtDvjSbUkTgPwmxQ-XUwY8MT80nN',
                    'https://drive.google.com/thumbnail?id=1LM1UTtDvjSbUkTgPwmxQ-XUwY8MT80nN&sz=w1000'
                ]
            },
            {
                id: '1tuhE4idPRsERI-xFltmax3xDG44vYhdj',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1tuhE4idPRsERI-xFltmax3xDG44vYhdj',
                    'https://lh3.googleusercontent.com/d/1tuhE4idPRsERI-xFltmax3xDG44vYhdj',
                    'https://drive.google.com/thumbnail?id=1tuhE4idPRsERI-xFltmax3xDG44vYhdj&sz=w1000'
                ]
            },
            {
                id: '1HBuayx4R21OCJ4KCSBbOtMe_LptWq-Ns',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1HBuayx4R21OCJ4KCSBbOtMe_LptWq-Ns',
                    'https://lh3.googleusercontent.com/d/1HBuayx4R21OCJ4KCSBbOtMe_LptWq-Ns',
                    'https://drive.google.com/thumbnail?id=1HBuayx4R21OCJ4KCSBbOtMe_LptWq-Ns&sz=w1000'
                ]
            },
            {
                id: '1m9vI52i_IDD9JIRABkiNnv9vfaFaNdlt',
                formats: [
                    'https://drive.google.com/uc?export=view&id=1m9vI52i_IDD9JIRABkiNnv9vfaFaNdlt',
                    'https://lh3.googleusercontent.com/d/1m9vI52i_IDD9JIRABkiNnv9vfaFaNdlt',
                    'https://drive.google.com/thumbnail?id=1m9vI52i_IDD9JIRABkiNnv9vfaFaNdlt&sz=w1000'
                ]
            }
        ];
        
        // Create photo slots
        function createPhotoSlots() {
            const gallery = document.getElementById('gallery');
            
            photoUrls.forEach((photo, index) => {
                const photoSlot = document.createElement('div');
                photoSlot.className = 'photo-slot';
                photoSlot.id = `photo-${index+1}`;
                
                // Create loading overlay
                const loadingOverlay = document.createElement('div');
                loadingOverlay.className = 'loading-overlay';
                
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                loadingOverlay.appendChild(spinner);
                
                // Create image element
                const img = document.createElement('img');
                img.alt = `Photo ${index+1}`;
                img.style.display = 'none';
                
                // Create placeholder
                const placeholder = document.createElement('div');
                placeholder.className = 'photo-placeholder';
                placeholder.innerHTML = '<i class="material-icons">add_photo_alternate</i><span>Loading...</span>';
                
                // Add elements to slot
                photoSlot.appendChild(loadingOverlay);
                photoSlot.appendChild(img);
                photoSlot.appendChild(placeholder);
                
                // Try loading image with different formats
                let formatIndex = 0;
                
                function tryLoadImage() {
                    if (formatIndex < photo.formats.length) {
                        img.src = photo.formats[formatIndex];
                        formatIndex++;
                    } else {
                        // All formats failed, show error
                        loadingOverlay.style.display = 'none';
                        img.style.display = 'none';
                        placeholder.innerHTML = '<i class="material-icons">broken_image</i><span>Foto gagal dimuat</span>';
                    }
                }
                
                img.onload = function() {
                    loadingOverlay.style.display = 'none';
                    placeholder.style.display = 'none';
                    img.style.display = 'block';
                };
                
                img.onerror = function() {
                    tryLoadImage();
                };
                
                // Start with first format
                tryLoadImage();
                
                // Add click event for modal
                photoSlot.addEventListener('click', function() {
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    
                    modal.style.display = 'block';
                    modalImg.src = img.src;
                });
                
                gallery.appendChild(photoSlot);
            });
        }
        
        // Modal close functionality
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const closeBtn = document.getElementsByClassName('close')[0];
        
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }
        
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // Back button functionality
        document.getElementById('back-button').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
        
        // Create floating hearts
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.innerHTML = '❤️';
                
                // Random position
                heart.style.left = Math.random() * 100 + '%';
                
                // Random size
                const size = Math.random() * 20 + 10;
                heart.style.fontSize = `${size}px`;
                
                // Random animation duration
                const duration = Math.random() * 10 + 10;
                heart.style.animationDuration = `${duration}s`;
                
                heartsContainer.appendChild(heart);
                
                // Remove heart after animation completes
                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);
            }, 2000);
        }
        
        // Initialize everything when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            createPhotoSlots();
            createFloatingHearts();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasara Website</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Quicksand:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Animated background elements */
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
            z-index: -1;
        }
        
        .bubble-1 {
            width: 200px;
            height: 200px;
            background-color: #ff758c;
            top: 10%;
            left: 5%;
            animation-duration: 25s;
        }
        
        .bubble-2 {
            width: 150px;
            height: 150px;
            background-color: #ff7eb3;
            top: 60%;
            right: 10%;
            animation-duration: 30s;
            animation-delay: 2s;
        }
        
        .bubble-3 {
            width: 180px;
            height: 180px;
            background-color: #8e7cc3;
            bottom: 10%;
            left: 15%;
            animation-duration: 35s;
            animation-delay: 5s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-20px) rotate(5deg);
            }
            66% {
                transform: translateY(20px) rotate(-5deg);
            }
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: #fff;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6, 0 0 50px #ff4da6;
            }
        }
        
        .menu-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 50px;
            width: 100%;
        }
        
        .menu-item {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-width: 200px;
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .menu-item:hover::before {
            opacity: 1;
        }
        
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .menu-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-title i {
            margin-right: 10px;
        }
        
        .features-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            width: 100%;
        }
        
        .mood-button {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-width: 250px;
        }
        
        .mood-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .mood-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            transition: all 0.5s ease;
        }
        
        .gombal-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            opacity: 0;
            transition: all 0.5s ease;
        }
        
        .show-gombal {
            opacity: 1;
        }
        
        .instagram-link {
            position: fixed;
            left: 20px;
            bottom: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        
        .instagram-link:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .instagram-link i {
            font-size: 30px;
            color: #fff;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(120%);
            transition: transform 0.5s ease;
            z-index: 1000;
            max-width: 300px;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .menu-container {
                gap: 20px;
            }
            
            .menu-item {
                min-width: 150px;
                padding: 15px 20px;
            }
            
            .menu-title {
                font-size: 1.2rem;
            }
            
            .mood-button {
                min-width: 200px;
                padding: 15px 20px;
            }
            
            .mood-text, .gombal-text {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .menu-container {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            
            .menu-item {
                width: 80%;
            }
            
            .mood-button {
                width: 80%;
            }
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Floating hearts animation */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .heart-float {
            position: absolute;
            bottom: -10%;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            animation: floatUp 15s linear infinite;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-bubble bubble-1"></div>
    <div class="bg-bubble bubble-2"></div>
    <div class="bg-bubble bubble-3"></div>
    
    <!-- Floating hearts -->
    <div class="floating-hearts" id="hearts-container"></div>
    
    <div class="container">
        <header>
            <h1>Welcome to Nasara Website</h1>
        </header>
        
        <section class="menu-container">
            <div class="menu-item" id="gallery-menu">
                <div class="menu-title">
                    <i class="material-icons">photo_library</i>
                    Our Gallery
                </div>
            </div>
            <div class="menu-item" id="minigame-menu">
                <div class="menu-title">
                    <i class="material-icons">sports_esports</i>
                    Mini Game
                </div>
            </div>
            <div class="menu-item" id="story-menu">
                <div class="menu-title">
                    <i class="material-icons">auto_stories</i>
                    Our Story
                </div>
            </div>
        </section>
        
        <section class="features-container">
            <div class="mood-button" id="mood-button">
                <div class="mood-text" id="mood-text">Pencet aku kalau kamu sedih atau badmood</div>
                <div class="gombal-text" id="gombal-text"></div>
            </div>
        </section>
    </div>
    
    <!-- Instagram Link -->
    <a href="https://www.instagram.com/nwaaard_/" target="_blank" class="instagram-link">
        <i class="material-icons">alternate_email</i>
    </a>
    
    <!-- Notification -->
    <div class="notification" id="notification"></div>
    
    <script>
        // Kata-kata gombal random
        const gombalTexts = [
            "Kamu tau nggak kenapa aku suka liat langit? Karena langit itu biru, dan aku suka biru. Tapi aku lebih suka liat kamu.",
            "Kamu itu seperti Google, karena kamu punya semua yang aku cari.",
            "Kalau kamu adalah buku, aku akan baca kamu setiap hari dan tidak akan pernah bosan.",
            "Aku nggak percaya sama love at first sight, tapi aku percaya sama smile at first sight, dan senyummu itu membuatku jatuh cinta.",
            "Aku mau jadi pembunuh, tapi pembunuh siapa? Pembunuh rasa cemburu setiap ada yang dekat denganmu.",
            "Kamu itu seperti bintang, jauh tapi tetap bersinar terang di hatiku.",
            "Kalau kamu adalah angin, aku mau jadi pohon biar kamu bisa selalu lewat di dekatku.",
            "Kamu itu seperti kopi, pahit di awal tapi manis di akhir, dan membuatku addicted.",
            "Aku mau jin, tapi bukan jin yang bisa ngabulin apa saja, tapi jin yang bisa ngabulin semua keinginanmu.",
            "Kamu itu seperti matahari, yang selalu membuat hariku cerah.",
            "Kalau kamu adalah waktu, aku mau berhenti di detik ini, agar aku bisa selalu bersamamu.",
            "Kamu itu seperti puzzle, sulit untuk dimengerti tapi seru untuk dipelajari.",
            "Aku mau jadi pelangi, biar bisa mewarnai harimu yang mungkin sedang mendung.",
            "Kalau kamu adalah buku, aku mau jadi bookmark, biar selalu ada di setiap halaman hidupmu.",
            "Kamu itu seperti bunga, yang indah untuk dipandang dan wangi untuk dirasakan.",
            "Aku mau jadi hujan, biar bisa membasahi hatimu yang mungkin sedang kering.",
            "Kamu itu seperti cokelat, manis, lezat, dan membuatku addicted.",
            "Kalau kamu adalah bulan, aku mau jadi bintang, biar bisa selalu bersinar di sampingmu."
        ];
        
        // Handle menu clicks
        document.getElementById('gallery-menu').addEventListener('click', function() {
            // Scroll to gallery section
            window.location.href = 'gallery.html';
        });
        
        document.getElementById('minigame-menu').addEventListener('click', function() {
            // Go to minigame page
            window.location.href = 'minigames.html';
        });
        
        document.getElementById('story-menu').addEventListener('click', function() {
            // Show notification
            const notification = document.getElementById('notification');
            notification.textContent = 'Our Story akan segera hadir!';
            notification.classList.add('show');
            
            // Hide notification after 3 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        });
        
        // Handle mood button click
        let gombalIndex = 0;
        let resetTimer = null;
        
        document.getElementById('mood-button').addEventListener('click', function() {
            const moodText = document.getElementById('mood-text');
            const gombalText = document.getElementById('gombal-text');
            
            // Clear any existing timer
            if (resetTimer) {
                clearTimeout(resetTimer);
            }
            
            // Get random gombal text
            const randomIndex = Math.floor(Math.random() * gombalTexts.length);
            gombalText.textContent = gombalTexts[randomIndex];
            
            // Show gombal text
            moodText.style.opacity = '0';
            gombalText.classList.add('show-gombal');
            
            // Set new timer to reset after 10 seconds
            resetTimer = setTimeout(() => {
                moodText.style.opacity = '1';
                gombalText.classList.remove('show-gombal');
                resetTimer = null;
            }, 10000);
        });
        
        // Create floating hearts
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.innerHTML = '❤️';
                
                // Random position
                heart.style.left = Math.random() * 100 + '%';
                
                // Random size
                const size = Math.random() * 20 + 10;
                heart.style.fontSize = `${size}px`;
                
                // Random animation duration
                const duration = Math.random() * 10 + 10;
                heart.style.animationDuration = `${duration}s`;
                
                heartsContainer.appendChild(heart);
                
                // Remove heart after animation completes
                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);
            }, 2000);
        }
        
        // Initialize everything when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            createFloatingHearts();
        });
    </script>
</body>
</html>
